services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: db
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    image: arnaudbena/esprit-canin-backend:0.9.0
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
