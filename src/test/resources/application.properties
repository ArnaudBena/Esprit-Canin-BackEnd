# =====================================================================
#  Profil de TEST (src/test/resources)
#  Ce fichier est invisible le application.properties principal : pendant les
#  tests, le classpath de test passe AVANT celui de src/main, donc c'est
#  celui-ci qui est lu. => pas de .env, pas de Postgres, tout en H2.
# =====================================================================

spring.application.name=Esprit-Canin-BackEnd-Test

# --- Base H2 en mémoire, en mode compatibilité PostgreSQL ---
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Schéma recréé à chaque run, puis seed data-init.sql ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.platform=init

# On désactive la validation Bean Validation au persist (comme le main)
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Secret JWT bidon : nécessaire pour que JwtFilter s'initialise.
# (Aucun token n'est envoyé dans les tests, @WithMockUser/@WithUserDetails
#  alimentent directement le SecurityContext, le filtre ne parse rien.)
jwt.secret=secret-de-test-junit-esprit-canin-ne-pas-utiliser-en-prod

# Identifiants admin bidon : nécessaires pour que l'AdminInitializer (CommandLineRunner)
# se construise au démarrage du contexte de test. Le runner ne crée rien : un admin est
# déjà seedé par data-init.sql, donc countByRoleNom("Admin") > 0 → il sort sans rien faire.
admin.email=admin-test@esprit-canin.test
admin.password=motDePasseTest

# Origines CORS bidon : nécessaire pour que SecurityConfig se construise au démarrage du contexte de test.
cors.allowed-origins=http://localhost:4200
