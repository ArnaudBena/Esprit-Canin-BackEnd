name: esprit-canin-prod

services:
  proxy:
    image: nginx:alpine
    container_name: esprit-canin-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      front:
        condition: service_started
      back:
        condition: service_healthy
    restart: unless-stopped

  front:
    image: ${FRONT_IMAGE}                         # image pull depuis Docker Hub
    container_name: esprit-canin-front
    expose:
      - "80"                                      # visible seulement en interne (pas de ports:)
    restart: unless-stopped

  back:
    image: ${BACK_IMAGE}
    container_name: esprit-canin-back
    expose:
      - "8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DDL_AUTO: ${DDL_AUTO}
      SQL_FILE: ${SQL_FILE}
      SQL_INIT_MODE: ${SQL_INIT_MODE}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: esprit-canin-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: