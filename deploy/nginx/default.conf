server {
    listen 80;

    # --- API : tout ce qui commence par /api/ part vers le back (en retirant /api) ---
    location /api/ {
        proxy_pass http://back:8080/;            # le "/" final retire le préfixe /api
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA Angular : tout le reste part vers le conteneur front ---
    location / {
        proxy_pass http://front:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}