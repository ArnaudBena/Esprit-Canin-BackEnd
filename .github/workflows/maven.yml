name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Extract project version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Build Docker Image
        run: docker build -t arnaudbena/esprit-canin-backend .

      - name: Tag image with version from pom.xml
        run: docker tag arnaudbena/esprit-canin-backend arnaudbena/esprit-canin-backend:${{ env.VERSION }}

      - name: Tag image with commit SHA
        run: docker tag arnaudbena/esprit-canin-backend arnaudbena/esprit-canin-backend:${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: docker push arnaudbena/esprit-canin-backend:${{ env.VERSION }}

      - name: Push SHA image
        run: docker push arnaudbena/esprit-canin-backend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy on the school VM
        run: |
          cd ~/esprit-canin
          sed -i "s#^BACK_IMAGE=.*#BACK_IMAGE=arnaudbena/esprit-canin-backend:${{ github.sha }}#" .env
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d